<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Be the Borrow Checker</title>
    <meta name="description" content="A Rust quiz where you play the compiler. Stamp snippets accepted or rejected, find the broken line, predict the output and pick the fix. Chapters that follow the Rust book, from ownership and lifetimes to traits, tests and async, every answer checked by rustc." />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101112" media="(prefers-color-scheme: dark)" />
    <!-- The blog's own icon, served by reinhash.com. -->
    <link rel="icon" href="/assets/nut-favicon.svg" type="image/svg+xml" />
    <script>
      // On reinhash.com the blog's theme switch stores a choice; follow it here too.
      try {
        var mode = localStorage.getItem("reinhash-theme-mode");
        if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding: 16px">This quiz needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
